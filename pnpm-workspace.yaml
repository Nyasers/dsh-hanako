# pnpm 11 构建脚本白名单（allowBuilds 取代 package.json 的 allowScripts / onlyBuiltDependencies）
# dsh 运行时树依赖的 install scripts：部署（pnpm add 到数据目录 dsh-pkg）时需放行。
# 本地开发（pnpm install 装构建树）与 CI（--frozen-lockfile）同样读取本文件，白名单不参与 lockfile 解析。
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  koffi: true
  node-pty: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@deepseek-ai/*"

# 多平台预编译资产：安装时同时物化 win32/darwin/linux × x64/arm64 的可选依赖，
# 让出一份安装产物就能覆盖三平台（打包时随包分发，安装方无需 npm install）。
# 注：pnpm 11 不再读 package.json 的 pnpm 字段（会打印 ignored 警告），此设置只能放这里。
supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - x64
    - arm64
