name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 显式装 pnpm（读 package.json packageManager 字段钉版本），不依赖 runner 预装 corepack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # 单测：139 例（node --test tests/，含 provider/task-bridge/watch-sse/cancel-chain/approval-bridge 等）
      - run: pnpm run test
      - run: pnpm audit --audit-level=high
