<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSHana</title>
<!-- src/ui/dshana/main.html — dsh-hanako App v2 主壳页（contributes.cards dshana route）。
     相对资源纪律（指南 §10）：本页与 ./app-shell.js 同层相对引用，无根路径绝对 URL。
     状态面 = 本 App 后端路由 /dshana/boot-state（App surface 授权下同源可达）。 -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    background: var(--dsh-shell-bg, #f6f7f9);
    color: var(--dsh-shell-fg, #1c2430);
  }
  @media (prefers-color-scheme: dark) {
    body { background: var(--dsh-shell-bg, #11151c); color: var(--dsh-shell-fg, #e6e9ef); }
  }
  .shell { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
    background: color-mix(in srgb, currentColor 4%, transparent);
    flex: 0 0 auto;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #8883; }
  .ph-ready .chip { background: #2e9e5b33; color: #1e7d45; }
  .ph-booting .chip { background: #c98a1033; color: #9a6a06; }
  .ph-error .chip { background: #c0392b33; color: #b03a2e; }
  main { flex: 1 1 auto; overflow: auto; padding: 16px; }
  .card {
    max-width: 860px; margin: 0 auto; padding: 18px 20px; border-radius: 10px;
    background: color-mix(in srgb, currentColor 3%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 10%, transparent);
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .muted { opacity: .72; font-size: 12.5px; }
  .err { color: #b03a2e; }
  button {
    font: inherit; padding: 7px 18px; border-radius: 8px; border: 1px solid currentColor;
    background: transparent; cursor: pointer;
  }
  button.primary { background: #2b6cd6; border-color: #2b6cd6; color: #fff; }
  [hidden] { display: none !important; }
  #frame-zone { position: relative; height: calc(100vh - 118px); border-radius: 8px; overflow: hidden; }
  iframe#dsh-frame { width: 100%; height: 100%; border: 1px solid color-mix(in srgb, currentColor 14%, transparent); border-radius: 8px; background: #fff; }
  .kvs { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin-top: 10px; }
  .kvs dt { font-weight: 600; }
  .kvs dd { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  footer { flex: 0 0 auto; padding: 6px 16px; font-size: 12px; opacity: .62; }
</style>
</head>
<body>
<div class="shell" data-dshana-shell data-dshana-view="main">
  <header>
    <h1>DSHana</h1>
    <span class="chip" data-dsh-phase>…</span>
    <span class="muted">DeepSeek Harness 受管 runtime</span>
  </header>
  <main data-dsh-body>
    <section class="card">
      <div data-dsh-detail>加载中……</div>
      <dl class="kvs">
        <dt>phase</dt><dd data-dsh-phase-code>–</dd>
        <dt>runtimeId</dt><dd data-dsh-runtime>–</dd>
      </dl>
      <div class="kvs" data-dsh-error-panel hidden>
        <dt>错误码</dt><dd data-dsh-error-code class="err">–</dd>
        <dt>详情</dt><dd data-dsh-error-text class="err">–</dd>
      </div>
      <div class="row" style="margin-top:14px" data-dsh-action hidden>
        <span class="muted">v2 无自动链：DSH 由会话任务首调自动启动，也可在此手动预热。</span>
        <button class="primary" data-dsh-start>启动 DSH</button>
      </div>
      <div class="muted" data-dsh-starting-note hidden style="margin-top:10px">
        DSH 启动中：首次含依赖安装与 profile 种子化，可能数分钟。App 日志见 dataDir/logs。
      </div>
      <div class="row" style="margin-top:14px" data-dsh-boot-line hidden>
        <span class="muted">就绪确认后自动载入 DSH Web UI。</span>
      </div>
      <div class="row" style="margin-top:14px" data-dsh-ready-note hidden>
        <span class="muted">DSH Web UI 已载入（宿主运行时服务代理前缀）。</span>
        <button data-dsh-stop>停止 DSH</button>
      </div>
    </section>
  </main>
  <div id="frame-zone" data-dsh-frame-zone style="padding:0 16px 8px" hidden>
    <iframe id="dsh-frame" data-dsh-frame title="DSH Web UI" hidden></iframe>
  </div>
  <footer>dsh-hanako · App v2（routes/cards/ui 迁移步骤 4b/5 代码侧；真机对账项见 DESIGN）</footer>
</div>
<script type="module" src="./app-shell.js"></script>
</body>
</html>
