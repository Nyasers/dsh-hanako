# @dsh-hanako/dshana — 定制 bundle patch。
#
# 层序（profile manifest 的 dsh.profile.bundles，后写胜出）：
#   @deepseek-ai/dsh-base → @deepseek-ai/dsh-web-app → @dsh-hanako/dshana（本文件）
#
# 官方两层已经提供：surface 值覆盖（system-prompt / session-query-sqlite / tools）、服务层
# （session / settings / workspace controller、web-startup / webserver / web-runtime、client-hmr）、
# **connection（官方 @deepseek-ai/dsh-client-connection：BrowserAuth token/cookie 鉴权面 + /api 载体）**、
# browser roster（modules / api-remotes / cordis-client-runner + 全部 ui-*）、agent-presets，
# 以及「agent plane 移入 presets」的 disabled 段。
#
# **本文件不重复官方行**，只放两类内容：
#   1) 对官方行的覆盖 / disable（我们自己的值）
#   2) @dsh-hanako/* 定制插件 insert
#
# 机制：一切经本 bundle 的 dsh.bundle.patch 声明（见 src-cordis/package.json），不使用 profile
# 用户层 cordis.patch.yml，也不使用命令行 --patch 叠加。
#
# 2026-09-11 起向官方样例 hana-dsh 看齐：连接与鉴权面交回官方（connection 由 dsh-web-app 层
# 提供，App 侧经 runtime 中继补 cookie），不再用 @dsh-hanako/bridge 伪造免鉴权 connection。

# ── 1) 对官方行的覆盖 ───────────────────────────────────────────────────────

# web-runtime（官方 @deepseek-ai/dsh-web-app 行）：App 内嵌场景不开系统浏览器、不打印 URL
# （由宿主卡片 / iframe 承载），surfaceContext 保留（模型可见 Web 面说明）。trustedHosts 沿用
# 官方表达式（LAN 字面量 + --trusted-host），不另开信任面。
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

# 官方 ui-layout 的「root 装配者」角色原本由 @dsh-hanako/view（client 半）接管——layout 服务与
# root 槽注册都在 view；官方行 disable，避免出现两个装配者。
#
# 2026-09-11 实验（黑屏定位）：dsh 0.1.5 下官方槽（如 sidebar.workspaces）读 `usePanelInfo` 时崩
# （`TypeError: usePanelInfo is not a function`），root 没挂载 → 整页黑。怀疑就是这层「接管」跟
# 0.1.5 的装配者契约对不上，故先把两个装配者成对换回官方：官方 ui-layout 放开、view 不插。
# 验证结论出来后再定长期形状（收敛回官方 + 集成，或补齐自接管契约）。
# - id: ui-layout
#   disabled: true

# ── 2) @dsh-hanako/* 定制插件 ──────────────────────────────────────────────
- insert:
    - id: '@dsh-hanako/logger'
      name: '@dsh-hanako/logger'

    - id: '@dsh-hanako/clipboard'
      name: '@dsh-hanako/clipboard'

    - id: '@dsh-hanako/theme'
      name: '@dsh-hanako/theme'

    - id: '@dsh-hanako/provider'
      name: '@dsh-hanako/provider'

    # 注（2026-09-11 退役）：@dsh-hanako/settings 整块退场——它在 dsh 设置页提供的
    # 「DSHana 设置」分页预定由**宿主面设置页**（contributes.settings.ui.route）替代；
    # 且它早已不可用：read/save 走的是 v1 路由 /api/hana-settings.*，App v2 下裸 fetch
    # 一直 403（真机 2026-09-11 实测，同批 403 见 dsh-upgrade-0.1.5 规范）。
    # 它不 provide 任何 service（inject 全是消费方：webServer/agentDefaultModel/
    # hanaLogger/dshanaBus），销毁无副作用，同时少一个 dshanaBus 消费者。
    # 需求交接：宿主面设置页需接住「dsh 默认模型（settings.yaml 的 agent-default-model）
    # 的读与写」；版本显示用构建期常量即可（v2 起版本锁插件发版，无远端检查）。
    # 原实现可在 git 历史里找回：src-cordis/plugins/settings/。

    # v1 遗留总线（dshana.bus WS 服务端）：v2 宿主不再连它，控制面改走 ctx.runtime.fetch
    # 到 runtime 中继的 /_control（见 src/runtime/bridge.js）。退役候选，暂留待真机确认无
    # 注入依赖后删除。
    - id: '@dsh-hanako/bus'
      name: '@dsh-hanako/bus'

    # 注（2026-09-11 真机验证结论）：@dsh-hanako/app（serve fork 官方前端到根路径）
    # 已删除。它与官方 web-runtime 的 frontend-static 抢同一个 fallback 席位，导致 index
    # 请求不经 ctx.connection.authorizeIndex → 进程 token 换 cookie 失败（runtime 启动
    # 卡在 auth-exchange，exit 7）。官方 frontend-static 自己就是正确的 index 处理者，
    # 前端服务交回官方。

    # fpFullPanel 视图装配插件：替代官方 ui-layout 的 root 装配者角色。
    # 2026-09-11 实验期暂不插入（见上条：成对换回官方 ui-layout）。
    # - id: '@dsh-hanako/view'
    #   name: '@dsh-hanako/view'
