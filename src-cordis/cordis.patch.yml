# dshana profile 的 user patch 层（$DSH_HOME/profiles/dshana/cordis.patch.yml）。
# 作为 profile 挂在官方 @deepseek-ai/dsh-base bundle 之后；叠加 @dsh-hanako/* 子插件
# 与服务层（无浏览器 UI，替代官方 web-app 的 UI 入口）。@dsh-hanako/* 子插件经
# node_modules/@dsh-hanako/* 实体随 profile 落位（见 build.mjs buildCordis）。
#
# 保留自 dsh-web-app 的 bundle patch：web-startup / webserver / web-runtime
# (URL+token print) / connection (Typert API + BrowserAuth) / api-* controllers
# / cordis runners / workspace & session services / theme service。
# 丢弃：全部 dsh-client-ui-* browser rows（无官方 UI——呈现由宿主插件页承担）。

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Host-owned opt-in sampled when a new Web session receives its preset
    # delegation tools.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # ── Typert API controllers (session/settings/workspace) ──────────────────
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Ordinary provider for the parsed launcher flags (host/port/trustedHosts).
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    # ── transport/service ────────────────────────────────────────────────────
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Host-side web runtime: prints the URL line (with launch token), mounts the
    # frontend-static fallback owner, provides webRuntime to the trust fence.
    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: client-locale
      name: '@deepseek-ai/dsh-client-locale'

    # Theme service (ctx.theme) — consumed by @dsh-hanako/theme bridge.
    - id: client-ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    # Agent 预设停靠点：default 指向 shipped preset（standard），dsh_run 的
    # agentPreset 参数会在会话预设处覆盖 default。
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # ── @dsh-hanako/* 子插件（覆盖 v0.22.1 静态 overlay 六段 insert）──────
    - id: '@dsh-hanako/logger'
      name: '@dsh-hanako/logger'

    - id: '@dsh-hanako/clipboard'
      name: '@dsh-hanako/clipboard'

    - id: '@dsh-hanako/theme'
      name: '@dsh-hanako/theme'

    - id: '@dsh-hanako/provider'
      name: '@dsh-hanako/provider'

    - id: '@dsh-hanako/settings'
      name: '@dsh-hanako/settings'

    - id: '@dsh-hanako/bridge'
      name: '@dsh-hanako/bridge'


