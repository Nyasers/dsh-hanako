# dshana profile 的 user patch 层（$DSH_HOME/profiles/dshana/cordis.patch.yml）。
# 作为 profile 挂在官方 @deepseek-ai/dsh-base + @deepseek-ai/dsh-web-app 两层 bundle
# 之后；叠加 @dsh-hanako/* 子插件。@dsh-hanako/* 子插件经 node_modules/@dsh-hanako/*
# 实体随 profile 落位（见 build.mjs buildCordis）。
#
# 形态说明（vX 定稿）：当前为过渡形态——宿主插件页 /webui 以 iframe 直嵌 3080 的
# fork SPA（@dsh-hanako/web-app 子插件 serve 官方 dist），fork SPA 是官方前端，
# 需要官方完整 client 插件树（slots/locale/settingsScope/uiWorkspace 由 browser
# 内核与 ui-layout 等提供）。故 bundle 用 dsh-web-app（自带完整 client roster +
# web-runtime/webserver/connection），本 patch 只叠加 @dsh-hanako 子插件与必要覆盖，
# 不再重复 insert 官方行（重复同 id 行会覆盖 bundle 配置、重复 insert 同包不同 id
# 会导致插件加载两次）。未来 headless（宿主 V2 apps 直嵌、3080 仅进程内自环）时
# 再评估裁剪 client roster。

# ── surface-specific 值覆盖（与官方 web bundle 同值，显式保留防 bundle 演进漂移）──

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # ── @dsh-hanako/* 子插件（覆盖 v0.22.1 静态 overlay 六段 insert）──────
    # 注：agent-presets 由官方 dsh-web-app bundle 尾部 insert 提供（default: standard），
    # 这里不再重复 insert（重复同 id 行会触发 loader duplicate entry 报错）。
    - id: '@dsh-hanako/logger'
      name: '@dsh-hanako/logger'

    - id: '@dsh-hanako/clipboard'
      name: '@dsh-hanako/clipboard'

    - id: '@dsh-hanako/theme'
      name: '@dsh-hanako/theme'

    - id: '@dsh-hanako/provider'
      name: '@dsh-hanako/provider'

    - id: '@dsh-hanako/settings'
      name: '@dsh-hanako/settings'

    - id: '@dsh-hanako/bridge'
      name: '@dsh-hanako/bridge'

